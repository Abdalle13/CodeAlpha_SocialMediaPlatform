<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veyra: Share your world.</title>
    <meta name="description" content="A content-first social platform for sharing moments, discovering creators, and connecting thoughtfully." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @keyframes veyra-spin {
        to { transform: rotate(360deg); }
      }
      .veyra-preloader-spin {
        animation: veyra-spin 0.8s linear infinite;
      }
    </style>
  </head>
  <body class="bg-page text-primary selection:bg-accent-soft selection:text-accent">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="none" style="margin-bottom: 16px;">
          <rect width="32" height="32" rx="7" fill="#245C43"/>
          <path d="M9 10L16 23L23 10" stroke="#F8F8F5" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 12px;">Veyra</div>
        <div class="veyra-preloader-spin" style="width: 24px; height: 24px; border: 2.5px solid #245C43; border-top-color: transparent; border-radius: 50%;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
